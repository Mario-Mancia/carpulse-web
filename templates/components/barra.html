<nav class="navbar navbar-expand-lg cp-barra">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'guest:inicio' %}">
      {% if recursos.logo %}<img src="{{ recursos.logo.url }}" alt="{{ recursos.logo.alt|default:nombre_plataforma }}" height="32">{% endif %}
      <span>{{ nombre_plataforma }}</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-2">
      {% if user.is_authenticated %}
        <a class="btn btn-sm btn-outline-light" href="{% url 'redirigir' %}">Mi panel</a>
        <form method="post" action="{% url 'account_logout' %}" class="m-0">
          {% csrf_token %}
          <button class="btn btn-sm btn-light" type="submit">Salir</button>
        </form>
      {% else %}
        <a class="btn btn-sm btn-light" href="{% url 'account_login' %}">Ingresar</a>
      {% endif %}
    </div>
  </div>
</nav>
